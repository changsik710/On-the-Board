<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 비밀번호 해시 생성기</title>
<style>
body{font-family:Pretendard,-apple-system,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;color:#111827}
input,button{width:100%;padding:10px;font-size:15px;margin:6px 0;border:1px solid #d8dce3;border-radius:6px;box-sizing:border-box}
button{background:#1d4ed8;color:#fff;border:none;cursor:pointer}
code{display:block;word-break:break-all;background:#f3f4f6;padding:12px;border-radius:6px;font-size:13px;margin-top:8px}
p{color:#6b7280;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<h2>관리자 비밀번호 해시 생성기</h2>
<p>새 관리자 비밀번호를 입력하면 SHA-256 해시값이 나옵니다.
이 값을 Supabase의 <b>app_config</b> 테이블 <b>admin_pw_hash</b> 열에 붙여넣으세요.
비밀번호 원문은 어디에도 저장되지 않습니다.</p>
<input id="pw" type="text" placeholder="새 관리자 비밀번호">
<button onclick="gen()">해시 생성</button>
<code id="out">-</code>
<script>
async function gen(){
  const v = document.getElementById('pw').value;
  if(!v){ document.getElementById('out').textContent='비밀번호를 입력하세요'; return; }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  const hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  document.getElementById('out').textContent = hex;
}
</script>
</body>
</html>
